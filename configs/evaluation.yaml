# Evaluation settings (read by src/evaluation/run_evaluation.py). Changing these changes reported numbers; the file is
# copied into every results.json via the run's experiment record, so results stay tied to the settings that made them.
confidence_levels: [0.5, 0.8, 0.9, 0.95]   # nominal levels for prediction intervals (raw and conformal)
best_of_n_samples: 10                       # oracle-selected best-of-N; reported separately, never as the headline
controlled_sweeps:                          # regenerate observations from test bases with one factor changed
  noise_mm: [0.0, 0.5, 1.0, 2.0, 3.0]
  density: [256, 512, 1024, 2048, 4096]
  sampler: [area, fps]
  deformation: [0.0, 0.03, 0.06, 0.10]
grouped_noise_bins_mm: [0, 0.5, 1.0, 1.51]
n_sweep_bases: null                         # null = use the function default
